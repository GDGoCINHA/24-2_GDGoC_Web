name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [ develop, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      # 배포 경로와 같은 명령이다. lock 파일이 어긋나면 여기서 먼저 걸린다.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # 시크릿을 주지 않는다. NEXT_PUBLIC_* 는 undefined 로 인라인되지만
      # 타입·import·라우팅·static export 제약 위반은 그대로 잡힌다.
      # 시크릿을 빼면 fork PR 에서도 돌고 워크플로가 단순해진다.
      - name: Build
        run: yarn build
